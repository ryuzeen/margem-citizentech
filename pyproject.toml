[project]
name = "margem"
version = "1.0.0"
description = "Margem - alerta comunitário de enchentes (FIAP Global Solution 2026/2 - CitizenTech)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["area1_ia/tests", "area2_bigdata/tests", "area3_mvp_iot/tests", "area4_devops/tests", "area4_devops/testes"]
addopts = "-q"
markers = ["e2e: testes ponta a ponta no navegador (Playwright)"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["dados", ".venv", "area3_mvp_iot/web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
